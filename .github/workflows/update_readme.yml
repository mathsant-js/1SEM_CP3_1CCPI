name: Atualizar Histórico de Commits no README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Gerar histórico de commits
        run: |
          echo "COMMITS_LIST<<EOF" >> $GITHUB_ENV
          git log --pretty=format:"* %h - %an: %s (%cr)" -n 30 >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Atualizar README
        run: |
          node -e "
            const fs = require('fs');

            const readmePath = 'README.md';
            const startTag = '<!--START_SECTION:commit_history-->';
            const endTag = '<!--END_SECTION:commit_history-->';

            let readme = fs.readFileSync(readmePath, 'utf8');

            const regex = new RegExp(
              startTag + '[\\\\s\\\\S]*?' + endTag
            );

            const newContent =
              startTag +
              '\n' +
              process.env.COMMITS_LIST +
              '\n' +
              endTag;

            if (!regex.test(readme)) {
              throw new Error(
                'Tags de commit history não encontradas no README.md'
              );
            }

            readme = readme.replace(regex, newContent);

            fs.writeFileSync(readmePath, readme);
          "

      - name: Commit e Push
        run: |
          if ! git diff --quiet; then
            git add README.md
            git commit -m "docs: atualizar histórico de commits [skip ci]"
            git push
          else
            echo "Nenhuma alteração detectada."
          fi