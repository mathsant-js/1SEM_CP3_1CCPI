name: Atualizar Histórico de Commits no README

on:
  push:
    branches:
      - main # Mude para master se o seu repositório usar master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Baixa todo o histórico de commits

      - name: Gerar histórico e injetar no README
        run: |
          # 1. Configura as credenciais temporárias do Git Bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 2. Coleta os últimos 30 commits formatados em Markdown
          COMMITS=$(git log --pretty=format:"* %h - %an: %s (%cr)" -n 30)
          
          # 3. Reescreve o README inserindo os commits entre as tags de marcação
          # Usa o node para fazer a substituição de forma segura contra quebras de linha
          node -e "
            const fs = require('fs');
            let readme = fs.readFileSync('README.md', 'utf8');
            const startTag = '<!--START_SECTION:commit_history-->';
            const endTag = '<!--END_SECTION:commit_history-->';
            const regex = new RegExp(startTag + '[\\\\s\\\\S]*?' + endTag);
            const content = startTag + '\\n' + process.env.COMMITS_LIST + '\\n' + endTag;
            fs.writeFileSync('README.md', readme.replace(regex, content));
          "
        env:
          COMMITS_LIST: ${{ env.COMMITS }}

      - name: Commit e Push das alterações
        run: |
          # Só faz o commit se houver modificações reais no README
          if ! git diff --exit-code README.md; then
            git add README.md
            git commit -m "docs: atualizado histórico de commits no README [skip ci]"
            git push
          fi
